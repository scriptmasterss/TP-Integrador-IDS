<!DOCTYPE html>
<html lang="es">
  {% include 'componentes/head.html' %}
  <body class="dashboard-body">
    <div class="dashboard-container">
      <!-- SIDEBAR FIJA -->
      <aside class="dashboard-sidebar-fixed">
        <div class="sidebar-logo">
          <img src="{{ url_for('static', filename='imagenes/logo_fiuba_blanco.png') }}"
               alt="Logo FIUBA"
               class="sidebar-logo-img" />
        </div>
        <ul class="quick-links">
          <li>
            <a href="{{ url_for('publico.index') }}"><i class="fa-solid fa-house"></i> Inicio</a>
          </li>
          {% block sidebar_links %}{% endblock %}
        </ul>
        <div class="sidebar-footer">
          <a href="{{ url_for('publico.cerrar_sesion') }}" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
        </div>
      </aside>
      <!-- PANEL PRINCIPAL -->
      <main class="dashboard-main-content">
        <header class="dashboard-topbar">
          <div>
            <h1 id="greeting">Panel de control</h1>
            <p id="current-date" class="dashboard-current-date"></p>
          </div>
          <div class="user-info">
            <span class="user-name" id="dashboard-user-name">{% block usuario_name %}Usuario{% endblock %}</span>
            <div class="user-avatar">
              <i class="fa-solid fa-user-tie"></i>
            </div>
          </div>
        </header>
        <section class="dashboard-content-area">
          {% block dashboard_content %}{% endblock %}
        </section>
      </main>
    </div>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
