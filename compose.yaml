services:
  frontend:
    build:
      context: ./app_frontend
    ports:
      - 5001:5000
    depends_on:
      - backend
    env_file:
      - ./app_frontend/.env

  backend:
    build:
      context: ./app_backend
    ports:
      - "5000:5000"
    env_file:
      - ./app_backend/.env
    depends_on:
      - db

  db:
    image: mysql:latest
    container_name: tp_integrador_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema_prestamos
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: